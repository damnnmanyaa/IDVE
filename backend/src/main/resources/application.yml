server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:idve_db}?sslmode=${DB_SSLMODE:disable}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
            scope:
              - email
              - profile
          github:
            client-id: ${GITHUB_CLIENT_ID:disabled-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:disabled-github-client-secret}
            scope:
              - read:user
              - user:email
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-ms: 86400000
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/login}
  otp:
    dev-fallback-enabled: false
  redis:
    enabled: ${REDIS_ENABLED:false}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:}
  demo-admin:
    email: ${DEMO_ADMIN_EMAIL:}
    password: ${DEMO_ADMIN_PASSWORD:}
  demo:
    reset-enabled: ${DEMO_RESET_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173}
